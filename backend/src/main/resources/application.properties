
spring.application.name=payment-orchestration

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# REDIS CONFIGURATION
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ==========================================
# PAYMENT GATEWAY AVAILABILITY
# ==========================================
payment.gateway.mock-a.enabled=true
payment.gateway.mock-b.enabled=true

# ==========================================
# GATEWAY A FAILURE SIMULATION
# ==========================================
payment.gateway.mock-a.simulate-failure=false

# ==========================================
# GATEWAY B FAILURE SIMULATION
# ==========================================
payment.gateway.mock-b.simulate-failure=false

# ==========================================
# RESILIENCE4J CIRCUIT BREAKER - GATEWAY A
# ==========================================
resilience4j.circuitbreaker.instances.mockGatewayA.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.mockGatewayA.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.mockGatewayA.slidingWindowSize=5
resilience4j.circuitbreaker.instances.mockGatewayA.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.mockGatewayA.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mockGatewayA.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.mockGatewayA.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.mockGatewayA.automaticTransitionFromOpenToHalfOpenEnabled=true

# ==========================================
# RESILIENCE4J CIRCUIT BREAKER - GATEWAY B
# ==========================================
resilience4j.circuitbreaker.instances.mockGatewayB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.mockGatewayB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.mockGatewayB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.mockGatewayB.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.mockGatewayB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mockGatewayB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.mockGatewayB.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.mockGatewayB.automaticTransitionFromOpenToHalfOpenEnabled=true
